spring.application.name=factory-copilot

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/factory_copilot
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
# Hindsight Cloud
hindsight.base-url=${HINDSIGHT_BASE_URL}
hindsight.api-key=${HINDSIGHT_API_KEY}
hindsight.bank-id=${HINDSIGHT_BANK_ID}