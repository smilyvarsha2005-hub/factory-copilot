<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Factory Floor Co-Pilot</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #0b1220;
            color: #ffffff;
            min-height: 100vh;
        }


        /* ================= HEADER ================= */

        .header {

            background: #111c2f;

            padding: 20px 35px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid #26354d;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .logo span {

            color: #38bdf8;

        }


        .status {

            color: #22c55e;

            font-size: 14px;

            font-weight: bold;

        }


        /* ================= MAIN ================= */

        .container {

            padding: 30px;

            max-width: 1400px;

            margin: auto;

        }


        .welcome {

            margin-bottom: 25px;

        }


        .welcome h1 {

            font-size: 32px;

            margin-bottom: 8px;

        }


        .welcome p {

            color: #94a3b8;

            font-size: 16px;

        }


        /* ================= BUTTON ================= */

        .analyze-button {

            margin-top: 20px;

            padding: 14px 24px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .analyze-button:hover {

            background: #1d4ed8;

            transform: translateY(-2px);

        }


        /* ================= MACHINE CARD ================= */

        .machine-card {

            background: #111c2f;

            border: 1px solid #26354d;

            border-radius: 16px;

            padding: 25px;

            margin-bottom: 25px;

        }


        .machine-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .machine-name {

            font-size: 26px;

            font-weight: bold;

        }


        .machine-id {

            color: #94a3b8;

            margin-top: 7px;

        }


        .warning {

            background: #7f1d1d;

            color: #fecaca;

            padding: 8px 16px;

            border-radius: 20px;

            font-weight: bold;

        }


        /* ================= SENSOR GRID ================= */

        .grid {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;

            margin-top: 25px;

        }


        .sensor {

            background: #162338;

            padding: 20px;

            border-radius: 12px;

            border: 1px solid #26354d;

        }


        .sensor-title {

            color: #94a3b8;

            font-size: 14px;

            margin-bottom: 10px;

        }


        .sensor-value {

            font-size: 30px;

            font-weight: bold;

        }


        .unit {

            color: #94a3b8;

            font-size: 14px;

        }


        /* ================= SECTIONS ================= */

        .section {

            background: #111c2f;

            border: 1px solid #26354d;

            border-radius: 16px;

            padding: 25px;

            margin-bottom: 25px;

        }


        .section h2 {

            margin-bottom: 18px;

        }


        .incident {

            background: #162338;

            padding: 18px;

            border-radius: 10px;

            margin-bottom: 12px;

        }


        .incident-title {

            font-weight: bold;

            margin-bottom: 7px;

        }


        .incident p {

            color: #cbd5e1;

            line-height: 1.5;

        }


        /* ================= AI ================= */

        .ai-box {

            background: #172554;

            border: 1px solid #2563eb;

            padding: 22px;

            border-radius: 12px;

        }


        .ai-title {

            color: #60a5fa;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 12px;

        }


        .recommendation {

            line-height: 1.7;

            color: #dbeafe;

        }


        .analysis-status {

            color: #93c5fd;

            font-weight: bold;

        }


        .success-message {

            background: #052e16;

            border: 1px solid #16a34a;

            color: #bbf7d0;

            padding: 15px;

            border-radius: 10px;

            margin-top: 15px;

        }


        /* ================= LOADING ================= */

        .loading {

            color: #94a3b8;

            padding: 20px 0;

        }


        /* ================= FOOTER ================= */

        .footer {

            text-align: center;

            color: #64748b;

            padding: 20px;

            font-size: 13px;

        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .grid {

                grid-template-columns: 1fr;

            }


            .machine-top {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }


            .header {

                padding: 18px;

            }


            .container {

                padding: 20px;

            }


            .welcome h1 {

                font-size: 27px;

            }

        }

    </style>

</head>



<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">

        🏭 AI Factory Floor

        <span>Co-Pilot</span>

    </div>


    <div class="status">

        ● SYSTEM ONLINE

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="container">


    <!-- WELCOME -->

    <div class="welcome">

        <h1>

            Factory Operations Dashboard

        </h1>


        <p>

            AI-assisted machine monitoring and troubleshooting

        </p>


        <button

            class="analyze-button"

            onclick="analyzeMachine()">

            🤖 Analyze Machine Problem

        </button>

    </div>



    <!-- DASHBOARD -->

    <div id="dashboard">

        <div class="loading">

            Loading machine information...

        </div>

    </div>


</main>



<!-- ================= FOOTER ================= -->

<div class="footer">

    AI Factory Floor Co-Pilot

    • Hack with Hyderabad 3.0

</div>



<script>


/* =========================================================
   MACHINE DATA

   This version is self-contained so the GitHub Pages
   deployment can work without localhost/Spring Boot.
========================================================= */


const machineData = {

    machine: {

        machineId: "PRESS-2018",

        machineName: "Hydraulic Press",

        status: "WARNING"

    },


    sensorReadings: [

        {

            vibration: 8.4,

            temperature: 92,

            pressure: 145

        }

    ],


    incidents: [

        {

            description:
                "Abnormal vibration detected during operation.",

            resolution:
                "Previous similar vibration was caused by a clogged residue trap."

        },

        {

            description:
                "Elevated temperature observed during previous operation.",

            resolution:
                "Technician inspection and residue trap cleaning were recommended."

        }

    ],


    maintenance: [

        {

            description:
                "Previous maintenance inspection completed on hydraulic press."

        },

        {

            description:
                "Residue trap inspection and cleaning recommended."

        }

    ]

};



/* =========================================================
   LOAD MACHINE
========================================================= */


function loadMachine() {

    displayDashboard(machineData);

}



/* =========================================================
   DISPLAY DASHBOARD
========================================================= */


function displayDashboard(data) {


    const machine =
        data.machine || {};


    const incidents =
        data.incidents || [];


    const maintenance =
        data.maintenance || [];


    const sensors =
        data.sensorReadings || [];


    let vibration =
        8.4;


    let temperature =
        92;


    let pressure =
        145;



    /* Latest sensor reading */

    if (sensors.length > 0) {

        const latest =
            sensors[sensors.length - 1];


        vibration =
            latest.vibration ??
            vibration;


        temperature =
            latest.temperature ??
            temperature;


        pressure =
            latest.pressure ??
            pressure;

    }



    /* =====================================================
       INCIDENT HTML
    ===================================================== */


    let incidentHTML = "";


    if (incidents.length === 0) {


        incidentHTML = `

            <div class="incident">

                <p>

                    No previous incidents found.

                </p>

            </div>

        `;


    }

    else {


        incidents.forEach(
            incident => {


                incidentHTML += `

                    <div class="incident">

                        <div class="incident-title">

                            ⚠️

                            ${incident.description}

                        </div>


                        <p>

                            ${incident.resolution}

                        </p>

                    </div>

                `;

            }
        );

    }



    /* =====================================================
       MAINTENANCE HTML
    ===================================================== */


    let maintenanceHTML = "";


    if (maintenance.length === 0) {


        maintenanceHTML = `

            <div class="incident">

                <p>

                    No maintenance records found.

                </p>

            </div>

        `;


    }

    else {


        maintenance.forEach(
            item => {


                maintenanceHTML += `

                    <div class="incident">

                        <div class="incident-title">

                            🔧 Maintenance Record

                        </div>


                        <p>

                            ${item.description}

                        </p>

                    </div>

                `;

            }
        );

    }



    /* =====================================================
       DASHBOARD HTML
    ===================================================== */


    document.getElementById(
        "dashboard"
    ).innerHTML = `


        <!-- MACHINE -->

        <div class="machine-card">


            <div class="machine-top">


                <div>

                    <div class="machine-name">

                        🏭

                        ${machine.machineName}

                    </div>


                    <div class="machine-id">

                        Machine ID:

                        ${machine.machineId}

                    </div>

                </div>


                <div class="warning">

                    ⚠ WARNING

                </div>


            </div>



            <!-- SENSOR GRID -->

            <div class="grid">


                <!-- VIBRATION -->

                <div class="sensor">

                    <div class="sensor-title">

                        VIBRATION

                    </div>


                    <div class="sensor-value">

                        ${vibration}

                    </div>


                    <span class="unit">

                        mm/s

                    </span>

                </div>



                <!-- TEMPERATURE -->

                <div class="sensor">

                    <div class="sensor-title">

                        TEMPERATURE

                    </div>


                    <div class="sensor-value">

                        ${temperature}

                    </div>


                    <span class="unit">

                        °C

                    </span>

                </div>



                <!-- PRESSURE -->

                <div class="sensor">

                    <div class="sensor-title">

                        PRESSURE

                    </div>


                    <div class="sensor-value">

                        ${pressure}

                    </div>


                    <span class="unit">

                        PSI

                    </span>

                </div>


            </div>


        </div>



        <!-- =================================================
             HISTORICAL INCIDENTS
        ================================================= -->


        <div class="section">


            <h2>

                ⚠️ Historical Incidents

            </h2>


            ${incidentHTML}


        </div>



        <!-- =================================================
             MAINTENANCE
        ================================================= -->


        <div class="section">


            <h2>

                🔧 Maintenance History

            </h2>


            ${maintenanceHTML}


        </div>



        <!-- =================================================
             AI COPILOT
        ================================================= -->


        <div class="section">


            <h2>

                🤖 AI Troubleshooting Co-Pilot

            </h2>


            <div

                class="ai-box"

                id="aiBox">


                <div class="ai-title">

                    Ready for Analysis

                </div>


                <div class="recommendation">

                    Click

                    <strong>

                        "Analyze Machine Problem"

                    </strong>

                    to analyze the current machine
                    condition and historical information.

                </div>


            </div>


        </div>


    `;

}



/* =========================================================
   AI ANALYSIS
========================================================= */


function analyzeMachine() {


    const aiBox =
        document.getElementById("aiBox");


    if (!aiBox) {

        return;

    }



    /* STEP 1 — ANALYZING */


    aiBox.innerHTML = `

        <div class="ai-title">

            🤖 AI Co-Pilot

        </div>


        <div class="recommendation">

            <p class="analysis-status">

                🔍 Analyzing machine condition...

            </p>


            <br>


            <p>

                Examining sensor readings,
                historical incidents and
                maintenance information.

            </p>


        </div>

    `;



    /* STEP 2 — SHOW RESULT */


    setTimeout(

        () => {


            aiBox.innerHTML = `


                <div class="ai-title">

                    🤖 AI Co-Pilot Analysis Complete

                </div>



                <div class="recommendation">


                    <p>

                        ⚠️

                        <strong>

                            Issue detected:

                        </strong>

                        abnormal vibration
                        and elevated temperature.

                    </p>


                    <br>


                    <p>

                        📊

                        <strong>

                            Sensor condition:

                        </strong>

                        Vibration is

                        <strong>

                            8.4 mm/s

                        </strong>

                        and temperature is

                        <strong>

                            92°C

                        </strong>.

                    </p>


                    <br>


                    <p>

                        🧠

                        <strong>

                            Historical match:

                        </strong>

                        A previous incident
                        showed similar vibration
                        behavior.

                    </p>


                    <br>


                    <p>

                        🔎

                        <strong>

                            Possible cause:

                        </strong>

                        Clogged residue trap.

                    </p>


                    <br>


                    <p>

                        🔧

                        <strong>

                            Recommended technician action:

                        </strong>

                        Inspect and clean the
                        residue trap before
                        performing further
                        calibration.

                    </p>


                    <br>


                    <p>

                        🚨

                        <strong>

                            Priority:

                        </strong>

                        High.

                    </p>


                    <div class="success-message">

                        ✅ Recommended next step:

                        Inspect the residue trap
                        and verify machine vibration
                        after cleaning.

                    </div>


                </div>

            `;


        },

        1500

    );

}



/* =========================================================
   START DASHBOARD
========================================================= */


loadMachine();


</script>


</body>

</html>
